name: XR Agent Final Verification And Cleanup

on:
  push:
    branches:
      - agent/xr-perf-guide
    paths:
      - .github/workflows/xr-agent-slice-c4.yml

permissions:
  contents: write

jobs:
  verify-cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/xr-perf-guide
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: webui/package-lock.json
      - name: Install
        working-directory: webui
        run: npm ci
      - name: Typecheck final WebUI
        working-directory: webui
        run: npm run typecheck
      - name: Run final full XR suite
        working-directory: webui
        run: npm run test:xr
      - name: Build final WebUI
        working-directory: webui
        run: npm run build
      - name: Remove agent-only CI scaffolding and commit final tree
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/xr-agent-slice-c.yml \
                    .github/workflows/xr-agent-slice-c2.yml \
                    .github/workflows/xr-agent-slice-c3.yml \
                    .github/workflows/xr-agent-slice-c4.yml \
                    .github/scripts/xr_slice_c_patch.py \
                    .github/scripts/xr_slice_d_patch.py \
                    .github/scripts/xr_slice_d2_patch.py \
                    .github/scripts/xr_slice_d3_patch.py \
                    .github/scripts/xr_slice_d4_patch.py \
                    .github/scripts/xr_slice_e_patch.py
          git diff --cached --name-only
          test -z "$(git status --porcelain --untracked-files=no | grep -v '^D  .github/' || true)" || {
            echo 'Unexpected tracked changes outside agent-only cleanup.' >&2
            git status --short
            exit 1
          }
          git commit -m 'remove temporary XR agent verification scaffolding'
          git push origin HEAD:agent/xr-perf-guide
