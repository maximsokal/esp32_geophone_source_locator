# PlatformIO compatibility smoke configuration for the historical
# Zephyr 4.2.1 package. This is intentionally not the production image.
# Keep it limited to symbols shared by the source fallback and the board;
# NCS v3.4.0 SoftDevice/RAS/Channel Sounding settings belong in prj.conf.

CONFIG_GPIO=y
CONFIG_I2C=y
CONFIG_I2C_TARGET=y
CONFIG_I2C_TARGET_BUFFER_MODE=y
CONFIG_I2C_NRFX_TWIS_BUF_SIZE=128
CONFIG_HWINFO=y
CONFIG_REBOOT=y
