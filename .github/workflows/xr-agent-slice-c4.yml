name: XR Agent Slice D Geometric Verification

on:
  push:
    branches:
      - agent/xr-perf-guide
    paths:
      - .github/workflows/xr-agent-slice-c4.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/xr-perf-guide
      - name: Apply Slice D candidate patches
        run: |
          python .github/scripts/xr_slice_d_patch.py
          python .github/scripts/xr_slice_d2_patch.py
          python .github/scripts/xr_slice_d3_patch.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: webui/package-lock.json
      - name: Install
        working-directory: webui
        run: npm ci
      - name: Typecheck
        working-directory: webui
        run: npm run typecheck
      - name: Verify endpoint and mesh
        working-directory: webui
        run: >-
          npx --yes vitest@4.1.11 run
          tests/xr/structuralEdgeEndpoints.test.ts
          tests/xr/meshPreview.test.ts
          tests/xr/meshTopologySanity.test.ts
          tests/xr/meshSelfIntersection.test.ts
          tests/xr/meshNormalIntrusion.test.ts
