id: ina3221-shared-bus
language: C
severity: error
message: INA3221 must borrow sensor_bus handles instead of owning the shared I2C bus.
files:
  - components/ina3221_monitor/**/*.c
rule:
  any:
    - pattern:
        context: i2c_new_master_bus($$$ARGS);
        selector: call_expression
    - pattern:
        context: i2c_del_master_bus($$$ARGS);
        selector: call_expression
    - pattern:
        context: i2c_master_bus_add_device($$$ARGS);
        selector: call_expression
    - pattern:
        context: i2c_master_bus_rm_device($$$ARGS);
        selector: call_expression
