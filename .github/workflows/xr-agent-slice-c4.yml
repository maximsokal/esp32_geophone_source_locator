name: XR Agent Slice E Verification

on:
  push:
    branches:
      - agent/xr-perf-guide
    paths:
      - .github/workflows/xr-agent-slice-c4.yml

permissions:
  contents: write

jobs:
  verify-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/xr-perf-guide
          fetch-depth: 0
      - name: Apply Slice E integration
        run: python .github/scripts/xr_slice_e_patch.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: webui/package-lock.json
      - name: Install
        working-directory: webui
        run: npm ci
      - name: Typecheck
        working-directory: webui
        run: npm run typecheck
      - name: Run Slice E capability regressions
        working-directory: webui
        run: >-
          npx --yes vitest@4.1.11 run
          tests/xr/xrCapabilityProfile.test.ts
          tests/xr/deviceComputeProfile.test.ts
          tests/xr/webxrRuntimeHelpers.test.ts
          tests/xr/rawCameraGuidance.test.ts
          tests/xr/cpuDepthSampler.test.ts
      - name: Run full XR suite
        working-directory: webui
        run: npm run test:xr
      - name: Commit verified Slice E integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add webui/src/xr/webxrRuntime.ts webui/src/components/XrRuntimePanel.tsx
          git diff --cached --quiet && { echo 'Expected Slice E integration changes are missing.' >&2; exit 1; }
          git commit -m 'expose negotiated XR device capabilities'
          git push origin HEAD:agent/xr-perf-guide
