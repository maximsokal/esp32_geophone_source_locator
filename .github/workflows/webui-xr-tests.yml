name: WebUI XR regression tests

on:
  push:
    branches:
      - main
    paths:
      - 'webui/src/xr/**'
      - 'webui/tests/xr/**'
      - 'webui/package.json'
      - '.github/workflows/webui-xr-tests.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'webui/src/xr/**'
      - 'webui/tests/xr/**'
      - 'webui/package.json'
      - '.github/workflows/webui-xr-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  xr-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: webui/package-lock.json
      - name: Install locked WebUI dependencies
        working-directory: webui
        run: npm ci
      - name: Run XR fusion regression tests
        working-directory: webui
        run: npm run test:xr
      - name: Typecheck and build production WebUI
        working-directory: webui
        run: npm run build
