name: XR Agent Slice D Certificate Diagnostics

on:
  push:
    branches:
      - agent/xr-perf-guide
    paths:
      - .github/workflows/xr-agent-slice-c4.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/xr-perf-guide
      - name: Apply Slice D candidate patches
        run: |
          python .github/scripts/xr_slice_d_patch.py
          python .github/scripts/xr_slice_d2_patch.py
      - name: Instrument endpoint and mesh certificates
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('webui/src/xr/structuralEdgeEndpoints.ts')
          s = p.read_text()
          old = """    if (local.length < MIN_PLANE_SUPPORT * 2) continue;\n\n    const planes = extractRobustPlanes(local, {"""
          new = """    if (local.length < MIN_PLANE_SUPPORT * 2) continue;\n    console.log('D_EP_LOCAL', JSON.stringify({ seed: seed.position, local: local.length }));\n\n    const planes = extractRobustPlanes(local, {"""
          if s.count(old) != 1: raise SystemExit('endpoint local anchor mismatch')
          s = s.replace(old, new, 1)
          old = """    if (planes.length !== 2) continue;\n\n    const edge = intersectTwoRobustPlanes(planes[0], planes[1], seed.position);\n    if (edge === null || edge.uncertaintyMeters > 0.035) continue;"""
          new = """    console.log('D_EP_PLANES', JSON.stringify(planes.map((plane) => ({ support: plane.support, tangent: plane.tangentSpreadMeters, confidence: plane.confidence, normal: plane.normal }))));\n    if (planes.length !== 2) continue;\n\n    const edge = intersectTwoRobustPlanes(planes[0], planes[1], seed.position);\n    console.log('D_EP_EDGE', JSON.stringify(edge));\n    if (edge === null || edge.uncertaintyMeters > 0.035) continue;"""
          if s.count(old) != 1: raise SystemExit('endpoint plane anchor mismatch')
          s = s.replace(old, new, 1)
          old = """    if (firstValues.length < MIN_EDGE_SIDE_SUPPORT || secondValues.length < MIN_EDGE_SIDE_SUPPORT) continue;"""
          new = """    console.log('D_EP_VALUES', JSON.stringify({ first: firstValues.length, second: secondValues.length }));\n    if (firstValues.length < MIN_EDGE_SIDE_SUPPORT || secondValues.length < MIN_EDGE_SIDE_SUPPORT) continue;"""
          if s.count(old) != 1: raise SystemExit('endpoint values anchor mismatch')
          s = s.replace(old, new, 1)
          p.write_text(s)

          p = Path('webui/src/xr/meshPreview.ts')
          s = p.read_text()
          old = """  const topology = sanitizeMeshTopology(Float32Array.from(triangles), input.voxelSizeMeters);\n  return {"""
          new = """  const topology = sanitizeMeshTopology(Float32Array.from(triangles), input.voxelSizeMeters);\n  if (sourcePointCount >= 100) {\n    console.log('D_MESH_TOPOLOGY', JSON.stringify({\n      generated: triangles.length / 9,\n      topology: {\n        triangleCount: topology.triangleCount,\n        sourceTriangleCount: topology.sourceTriangleCount,\n        retainedTriangleCount: topology.retainedTriangleCount,\n        quarantinedTriangleCount: topology.quarantinedTriangleCount,\n        discardedTriangleCount: topology.discardedTriangleCount,\n        nonManifoldEdgeCount: topology.nonManifoldEdgeCount,\n        selfIntersectionPairCount: topology.selfIntersectionPairCount,\n        selfIntersectionAffectedTriangleCount: topology.selfIntersectionAffectedTriangleCount,\n        selfIntersectionTruncated: topology.selfIntersectionTruncated,\n        normalIntrusionAffectedTriangleCount: topology.normalIntrusionAffectedTriangleCount,\n        normalIntrusionTruncated: topology.normalIntrusionTruncated,\n        components: topology.components,\n      },\n    }));\n  }\n  return {"""
          if s.count(old) != 1: raise SystemExit('mesh topology anchor mismatch')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: webui/package-lock.json
      - name: Install
        working-directory: webui
        run: npm ci
      - name: Diagnose endpoint
        continue-on-error: true
        working-directory: webui
        run: npx --yes vitest@4.1.11 run tests/xr/structuralEdgeEndpoints.test.ts
      - name: Diagnose mesh
        continue-on-error: true
        working-directory: webui
        run: npx --yes vitest@4.1.11 run tests/xr/meshPreview.test.ts
