name: XR Agent Slice A

on:
  push:
    branches:
      - agent/xr-perf-guide
    paths:
      - .github/workflows/xr-agent-slice-a.yml

permissions:
  contents: write

jobs:
  implement-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/xr-perf-guide
          fetch-depth: 0

      - name: Wire structural feature maturity
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('webui/src/components/StructuralGuideOverlay.tsx')
          text = path.read_text(encoding='utf-8')
          old = """  const readinessLabel = compactScanReadinessLabel(readiness, {\n    visibleCorners: projectedCorners.length,\n    certifiedCorners: certifiedCandidates.length,\n    certifiedEdges: certifiedEdgeCandidates.length,\n    rgbCorroboration: rgbActive,\n  });"""
          new = """  const readinessLabel = compactScanReadinessLabel(readiness, {\n    visibleCorners: projectedCorners.length,\n    certifiedCorners: certifiedCandidates.length,\n    certifiedEdges: certifiedEdgeCandidates.length,\n    planarPatches: result?.planarPatches ?? 0,\n    workerEdges: result?.edges.length ?? 0,\n    rgbCorroboration: rgbActive,\n  });"""
          if text.count(old) != 1:
              raise SystemExit('StructuralGuideOverlay readiness block did not match exactly once')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: webui/package-lock.json

      - name: Install WebUI dependencies
        working-directory: webui
        run: npm ci

      - name: Typecheck WebUI
        working-directory: webui
        run: npm run typecheck

      - name: Run Slice A regression tests
        working-directory: webui
        run: npx --yes vitest@4.1.11 run tests/xr/scanReadinessUi.test.ts tests/xr/structuralCornerScaleIsolation.test.ts

      - name: Record full XR baseline without blocking Slice A
        continue-on-error: true
        working-directory: webui
        run: npm run test:xr

      - name: Commit verified Slice A
        shell: bash
        run: |
          if git diff --quiet -- webui/src/components/StructuralGuideOverlay.tsx; then
            echo 'Expected StructuralGuideOverlay change is missing.' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add webui/src/components/StructuralGuideOverlay.tsx
          git commit -m 'wire XR structural feature maturity into readiness UI'
          git push origin HEAD:agent/xr-perf-guide
