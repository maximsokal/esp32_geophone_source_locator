# MAX-45 build-only Channel Sounding proof for nRF Connect SDK v3.4.0.
# This file is additive to nRF54L15/zephyr/prj.conf and does not change the
# existing upstream I2C wire protocol or start a ranging scheduler.

CONFIG_BT=y
CONFIG_BT_CENTRAL=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_MAX_CONN=1
CONFIG_BT_BONDABLE=n

# Nordic SoftDevice Controller is required for nRF54L15 Channel Sounding.
CONFIG_BT_LL_SOFTDEVICE=y
CONFIG_BT_LL_SOFTDEVICE_MULTIROLE=y
CONFIG_BT_CHANNEL_SOUNDING=y
CONFIG_BT_CTLR_CHANNEL_SOUNDING=y
CONFIG_BT_CTLR_CHANNEL_SOUNDING_TEST=n

# The first architecture uses one simultaneous BLE connection/CS procedure.
# NCS v3.4.0's SDC keeps central+peripheral capability with BT_MAX_CONN=1 when
# the roles are used sequentially, so a second host connection slot is waste.
CONFIG_BT_CTLR_SDC_PERIPHERAL_COUNT=1
CONFIG_BT_CTLR_SDC_CS_ROLE_BOTH=y
CONFIG_BT_CTLR_SDC_CS_COUNT=1

# First implementation is deliberately single-antenna and mode-3-disabled.
CONFIG_BT_CTLR_SDC_CS_MAX_ANTENNA_PATHS=1
CONFIG_BT_CTLR_SDC_CS_NUM_ANTENNAS=1
CONFIG_BT_CTLR_SDC_CS_STEP_MODE3=n

# A single reassembly buffer is enough while only one CS procedure may run.
# 1920 bytes matches Nordic's single-antenna/no-mode-3 RAS memory profile and
# is a proof-time bound, not a final distance-estimation contract.
CONFIG_BT_CHANNEL_SOUNDING_REASSEMBLY_BUFFER_CNT=1
CONFIG_BT_CHANNEL_SOUNDING_REASSEMBLY_BUFFER_SIZE=1920
