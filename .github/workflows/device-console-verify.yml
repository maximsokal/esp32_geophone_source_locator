name: device-console-verify

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: device-console-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  webui:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: webui/package-lock.json
      - name: Install WebUI dependencies
        working-directory: webui
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        working-directory: webui
        run: npm run typecheck
      - name: Console API tests
        working-directory: webui
        run: npm run test:console
      - name: XR tests
        working-directory: webui
        run: npm run test:xr
      - name: Host hardware/status and measurement tests
        run: |
          set -euo pipefail
          cc -std=c11 -Wall -Wextra -Werror \
            -Icomponents/ad7606_driver \
            components/ad7606_driver/ad7606_presence_policy.c \
            components/ad7606_driver/tests/ad7606_presence_policy_test.c \
            -o /tmp/ad7606_presence_policy_test
          /tmp/ad7606_presence_policy_test
          cc -std=c11 -Wall -Wextra -Werror \
            -Icomponents/ina3221_monitor \
            components/ina3221_monitor/ina3221_policy.c \
            components/ina3221_monitor/tests/ina3221_policy_test.c \
            -o /tmp/ina3221_policy_test
          /tmp/ina3221_policy_test
          cc -std=c11 -Wall -Wextra -Werror \
            -Icomponents/web_server \
            components/web_server/web_status_policy.c \
            components/web_server/tests/web_status_policy_test.c \
            -o /tmp/web_status_policy_test
          /tmp/web_status_policy_test
          cc -std=c11 -Wall -Wextra -Werror \
            -Icomponents/ui \
            -Icomponents/ui/tests/stubs \
            -Icomponents/seismic_buffer/include \
            components/ui/ui_measurement_trace.c \
            components/ui/tests/ui_measurement_trace_test.c \
            -o /tmp/ui_measurement_trace_test
          /tmp/ui_measurement_trace_test
      - name: Production build and ESP asset preparation
        working-directory: webui
        run: npm run build
      - name: Verify code split contract
        working-directory: webui
        run: npm run verify:bundle
      - name: Verify production optimization contracts
        run: |
          set -e
          test ! -e components/web_server/web_static_assets.c
          ! grep -q 'web_static_assets_register' components/web_server/web_server_internal.h
          grep -A4 'max_uri_handlers' components/web_server/web_server.c | head -n 5 | grep -q '10;'
          grep -q 'assets/\*.css.gz' components/web_server/CMakeLists.txt
          grep -q 'web_api_control.c' components/web_server/CMakeLists.txt
          grep -q 'web_status_policy.c' components/web_server/CMakeLists.txt
          grep -q 'object_store' components/web_server/CMakeLists.txt
          grep -q 'seismic_recorder' components/web_server/CMakeLists.txt
          grep -q 'object_store_json_read_profile_with_defaults_locked' components/object_store/object_store_profile.c
          grep -q 'object_store_list_profiles_with_defaults' components/object_store/object_store_profile.c
          grep -q 'OBJECT_STORE_INDEX_RECONCILE_INTERVAL_US' components/object_store/object_store_profile.c
          grep -q 's_settings_cache_valid' components/object_store/object_store_profile.c
          grep -q 'object_store_profile_index_reconcile_locked' components/object_store/object_store_profile.c
          ! grep -q 'object_store_fs_object_exists(entry->d_name)' components/object_store/object_store_fs_list.c
          grep -q 'object_store_internal_begin_state_operation' components/object_store/object_store_state.c
          grep -q 'object_store_list_profiles_with_defaults' components/web_server/web_status_json_objects.c
          ! grep -q 'object_store_get_cable_defaults' components/web_server/web_status_json_objects.c
          grep -q 'WEB_OBJECT_CACHE_TTL_US' components/web_server/web_status_json_objects.c
          grep -q 'web_status_json_objects_invalidate' components/web_server/web_api_control.c
          grep -q 'Server-Timing' components/web_server/web_api_status.c
          grep -q 'ad7606_driver_presence_monitor_start' components/seismic_acquisition/seismic_source_ad7606.c
          grep -q 'GPIO_PULLDOWN_ONLY' components/ad7606_driver/ad7606_presence.c
          grep -q 'BOARD_SENSOR_I2C_SDA_GPIO.*GPIO_NUM_9' components/board_config/include/board_config.h
          grep -q 'BOARD_SENSOR_I2C_SCL_GPIO.*GPIO_NUM_10' components/board_config/include/board_config.h
          grep -q 'BOARD_INA3221_I2C_ADDRESS.*0x40' components/board_config/include/board_config.h
          grep -q 'ina3221_monitor_start' main/app_startup.c
          grep -q 'ina3221_monitor_stop' main/app_shutdown.c
          grep -q '"ESP32_5V"' components/web_server/web_status_json.c
          grep -q '"AD7606_5V"' components/web_server/web_status_json.c
          grep -q 'capabilities.local_position' components/device_status/device_status_pods.c
          grep -q '"position"' components/web_server/web_status_json_pods.c
          grep -q "import ObjectsFeature from './features/objects/ObjectsFeature'" webui/src/DeviceConsoleApp.tsx
          grep -q "import SensorsFeature from './features/sensors/SensorsFeature'" webui/src/DeviceConsoleApp.tsx
          ! grep -q "lazy(() => import('./features/objects/ObjectsFeature'))" webui/src/DeviceConsoleApp.tsx
          ! grep -q "lazy(() => import('./features/sensors/SensorsFeature'))" webui/src/DeviceConsoleApp.tsx
          grep -q 'generated_webui_chunks/' .gitignore
          grep -q 'CONFIG_MBEDTLS_EXTERNAL_MEM_ALLOC=y' sdkconfig.tls.defaults
          grep -q 'CONFIG_SPIRAM_ALLOW_BSS_SEG_EXTERNAL_MEMORY=y' sdkconfig.tls.defaults
          grep -q 'CONFIG_MBEDTLS_SERVER_SSL_SESSION_TICKETS=y' sdkconfig.tls.defaults
          grep -q 'CONFIG_ESP_TLS_SERVER_SESSION_TICKETS=y' sdkconfig.tls.defaults
          grep -q 'config.session_tickets = true' components/web_server/web_server.c
          grep -q 'WEB_TLS_FATAL_ALERT_CODE 0x7780' components/web_server/web_server.c
          grep -q 'app_build_config_guard.c' main/CMakeLists.txt
      - name: Show split assets
        working-directory: webui
        run: |
          find dist/assets -maxdepth 1 -type f -printf '%f %s bytes\n' | sort
          find esp-dist/assets -maxdepth 1 -type f -printf '%f %s bytes\n' | sort

  firmware:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Build production firmware with ESP-IDF 5.5.4 and Node 22
        run: |
          docker run --rm \
            -v "$PWD:/project" \
            -w /project \
            espressif/idf:v5.5.4 \
            bash -lc '
              set -e
              git config --global --add safe.directory /project
              apt-get update >/dev/null
              apt-get install -y curl ca-certificates gnupg >/dev/null
              curl -fsSL https://deb.nodesource.com/setup_22.x | bash - >/dev/null
              apt-get install -y nodejs >/dev/null
              node --version
              npm --version
              idf.py build
            '
