name: device-console-verify

on:
  push:
    branches:
      - agent/xr-perf-guide
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: device-console-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  webui:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Apply pending production optimizations
        run: |
          python3 .github/scripts/device_console_cmake_patch.py
          python3 .github/scripts/device_console_perf_patch.py
          python3 .github/scripts/device_console_next_patch.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: webui/package-lock.json
      - name: Install WebUI dependencies
        working-directory: webui
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        working-directory: webui
        run: npm run typecheck
      - name: XR tests
        working-directory: webui
        run: npm run test:xr
      - name: Production build and ESP asset preparation
        working-directory: webui
        run: npm run build
      - name: Verify code split contract
        working-directory: webui
        run: npm run verify:bundle
      - name: Verify optimization source contracts
        run: |
          set -e
          test ! -e components/web_server/web_static_assets.c
          ! grep -q 'web_static_assets_register' components/web_server/web_server_internal.h
          grep -q 'max_uri_handlers =.*' components/web_server/web_server.c || true
          grep -A1 'config.httpd.max_uri_handlers' components/web_server/web_server.c | grep -q '10;'
          grep -q 'object_store_json_read_profile_with_defaults_locked' components/object_store/object_store_profile.c
          grep -q 'capabilities.local_position' components/device_status/device_status_pods.c
          grep -q '"position"' components/web_server/web_status_json_pods.c
      - name: Show split assets
        working-directory: webui
        run: |
          find dist/assets -maxdepth 1 -type f -printf '%f %s bytes\n' | sort
          find esp-dist/assets -maxdepth 1 -type f -printf '%f %s bytes\n' | sort

  firmware:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Apply pending production optimizations
        run: |
          python3 .github/scripts/device_console_cmake_patch.py
          python3 .github/scripts/device_console_perf_patch.py
          python3 .github/scripts/device_console_next_patch.py
      - name: Build firmware with ESP-IDF 5.5.4 and Node 22
        run: |
          docker run --rm \
            -v "$PWD:/project" \
            -w /project \
            espressif/idf:v5.5.4 \
            bash -lc '
              set -e
              git config --global --add safe.directory /project
              apt-get update >/dev/null
              apt-get install -y curl ca-certificates gnupg >/dev/null
              curl -fsSL https://deb.nodesource.com/setup_22.x | bash - >/dev/null
              apt-get install -y nodejs >/dev/null
              node --version
              npm --version
              idf.py build
            '

  finalize-production:
    needs: [webui, firmware]
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Persist all verified production changes
        run: |
          set -e
          python3 .github/scripts/device_console_cmake_patch.py
          python3 .github/scripts/device_console_perf_patch.py
          python3 .github/scripts/device_console_next_patch.py
          if git diff --quiet -- components main webui; then
            echo 'Verified production changes are already committed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A components main webui
          git commit -m 'optimize object reads routes and pod status model'
          git push origin HEAD:agent/xr-perf-guide
