CONFIG_GPIO=y
CONFIG_I2C=y
CONFIG_I2C_TARGET=y
CONFIG_I2C_TARGET_BUFFER_MODE=y
CONFIG_I2C_NRFX_TWIS_BUF_SIZE=128
CONFIG_HWINFO=y
CONFIG_REBOOT=y

# Canonical nRF54L15 production firmware is NCS v3.4.0 / Zephyr 4.4.0.
# All XIAO nodes use one image with both BLE link roles and both CS roles;
# wired MAIN/REMOTE identity remains a runtime assignment.
CONFIG_BT=y
CONFIG_BT_SMP=y
CONFIG_BT_CENTRAL=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_MAX_CONN=1
CONFIG_BT_BONDABLE=n
CONFIG_BT_GAP_AUTO_UPDATE_CONN_PARAMS=n
CONFIG_BT_AUTO_PHY_UPDATE=n
CONFIG_BT_LL_SOFTDEVICE=y
CONFIG_BT_LL_SOFTDEVICE_MULTIROLE=y

# RAS requester + responder coexist in the common image. RRSP auto-allocates
# the single connection slot when this node is acting as reflector.
CONFIG_BT_RAS=y
CONFIG_BT_RAS_RREQ=y
CONFIG_BT_RAS_RREQ_MAX_ACTIVE_CONN=1
CONFIG_BT_RAS_RRSP=y
CONFIG_BT_RAS_RRSP_AUTO_ALLOC_INSTANCE=y
CONFIG_BT_RAS_RRSP_MAX_ACTIVE_CONN=1
CONFIG_BT_RAS_RRSP_RD_BUFFERS_PER_CONN=1
CONFIG_BT_GATT_DYNAMIC_DB=y
CONFIG_BT_L2CAP_TX_MTU=498
CONFIG_BT_BUF_ACL_TX_SIZE=502
CONFIG_BT_BUF_ACL_RX_SIZE=502
CONFIG_BT_ATT_PREPARE_COUNT=3
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251
CONFIG_BT_CTLR_PHY_2M=y

# Channel Sounding is serialized: one link/context, one antenna path, no mode 3.
CONFIG_BT_CHANNEL_SOUNDING=y
CONFIG_BT_CTLR_CHANNEL_SOUNDING=y
CONFIG_BT_CTLR_CHANNEL_SOUNDING_TEST=n
CONFIG_BT_CTLR_SDC_PERIPHERAL_COUNT=1
CONFIG_BT_CTLR_SDC_CS_ROLE_BOTH=y
CONFIG_BT_CTLR_SDC_CS_COUNT=1
CONFIG_BT_RAS_MODE_3_SUPPORTED=n
CONFIG_BT_RAS_MAX_ANTENNA_PATHS=1
CONFIG_BT_CTLR_SDC_CS_MAX_ANTENNA_PATHS=1
CONFIG_BT_CTLR_SDC_CS_NUM_ANTENNAS=1
CONFIG_BT_CTLR_SDC_CS_STEP_MODE3=n
CONFIG_BT_CHANNEL_SOUNDING_REASSEMBLY_BUFFER_CNT=1
CONFIG_BT_CHANNEL_SOUNDING_REASSEMBLY_BUFFER_SIZE=1920
CONFIG_BT_TRANSMIT_POWER_CONTROL=y

# Initial MAX-51 estimator uses Nordic's single-path CS distance-estimation
# library. Confidence is deliberately binary usability, not calibrated accuracy.
CONFIG_BT_CS_DE=y
CONFIG_BT_CS_DE_512_NFFT=y
CONFIG_BT_CS_DE_MAX_NUM_ANTENNA_PATHS=1
CONFIG_FPU=y
CONFIG_FPU_SHARING=y
