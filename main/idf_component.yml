dependencies:
  idf:
    version: ">=5.5,<6"

  espressif/esp_lcd_ili9341: "^2.0.2"

  # Official Espressif LVGL integration. This owns the LVGL handler
  # task and bridges LVGL 9 to the existing esp_lcd ILI9341 panel.
  espressif/esp_lvgl_port: "^2.9.0"

  # Pin the UI to LVGL 9 now, before the screen/widget surface grows.
  lvgl/lvgl: "^9.5.0"

  # Official Espressif mDNS responder. Pin a known-stable release rather than
  # automatically taking a newly published minor version during reconfigure.
  espressif/mdns: "1.11.3"
