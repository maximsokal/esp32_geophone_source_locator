name: XR reconstruction hardening VM

on:
  push:
    branches:
      - agent/xr-reconstruction-hardening
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xr-hardening-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-webxr:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: webui/package-lock.json

      - name: Install locked WebUI dependencies
        working-directory: webui
        run: npm ci

      - name: Run full XR regression suite
        working-directory: webui
        run: npm run test:xr

      - name: Measure algorithm-core V8 coverage
        working-directory: webui
        run: npm run test:xr:coverage

      - name: Mutation smoke - tentative surfaces must not become green
        working-directory: webui
        shell: bash
        run: |
          set -euo pipefail
          cp src/xr/surfelEvidence.ts /tmp/surfelEvidence.ts
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/xr/surfelEvidence.ts')
          s = p.read_text()
          old = 'return input.promoted ? raw : Math.min(0.46, raw * 0.62);'
          assert old in s
          p.write_text(s.replace(old, 'return 1;'))
          PY
          set +e
          npm run test:xr >/tmp/mutation-confidence.log 2>&1
          code=$?
          set -e
          cp /tmp/surfelEvidence.ts src/xr/surfelEvidence.ts
          if [ "$code" -eq 0 ]; then
            cat /tmp/mutation-confidence.log
            echo 'Mutation survived: tests did not detect forced-green tentative points.' >&2
            exit 1
          fi
          echo 'Mutation killed: forced-green tentative surfaces were detected.'

      - name: Mutation smoke - normal gate must protect hard edges
        working-directory: webui
        shell: bash
        run: |
          set -euo pipefail
          cp src/xr/surfelEvidence.ts /tmp/surfelEvidence.ts
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/xr/surfelEvidence.ts')
          s = p.read_text()
          old = "if (!Number.isFinite(maxAngleRadians) || maxAngleRadians <= 0) return false;\n  return Math.acos(Math.abs(dotVector(a, b))) <= maxAngleRadians;"
          assert old in s
          p.write_text(s.replace(old, "if (!Number.isFinite(maxAngleRadians) || maxAngleRadians <= 0) return false;\n  return true;"))
          PY
          set +e
          npm run test:xr >/tmp/mutation-normal.log 2>&1
          code=$?
          set -e
          cp /tmp/surfelEvidence.ts src/xr/surfelEvidence.ts
          if [ "$code" -eq 0 ]; then
            cat /tmp/mutation-normal.log
            echo 'Mutation survived: tests did not detect disabled normal gating.' >&2
            exit 1
          fi
          echo 'Mutation killed: disabled normal gating was detected.'

      - name: Mutation smoke - sampler must not collapse to a fixed lattice point
        working-directory: webui
        shell: bash
        run: |
          set -euo pipefail
          cp src/xr/surfelEvidence.ts /tmp/surfelEvidence.ts
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/xr/surfelEvidence.ts')
          s = p.read_text()
          old = "return [safeMargin + u01 * usable, safeMargin + v01 * usable];"
          assert old in s
          p.write_text(s.replace(old, "return [safeMargin + usable * 0.5, safeMargin + usable * 0.5];"))
          PY
          set +e
          npm run test:xr >/tmp/mutation-sampler.log 2>&1
          code=$?
          set -e
          cp /tmp/surfelEvidence.ts src/xr/surfelEvidence.ts
          if [ "$code" -eq 0 ]; then
            cat /tmp/mutation-sampler.log
            echo 'Mutation survived: tests did not detect collapsed sampling.' >&2
            exit 1
          fi
          echo 'Mutation killed: collapsed low-discrepancy sampling was detected.'

      - name: Mutation smoke - unseen volume must stay unknown
        working-directory: webui
        shell: bash
        run: |
          set -euo pipefail
          cp src/xr/occupancyEvidence.ts /tmp/occupancyEvidence.ts
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/xr/occupancyEvidence.ts')
          s = p.read_text()
          old = "if (cell === undefined) return 'unknown';"
          assert old in s
          p.write_text(s.replace(old, "if (cell === undefined) return 'free';"))
          PY
          set +e
          npm run test:xr >/tmp/mutation-unknown.log 2>&1
          code=$?
          set -e
          cp /tmp/occupancyEvidence.ts src/xr/occupancyEvidence.ts
          if [ "$code" -eq 0 ]; then
            cat /tmp/mutation-unknown.log
            echo 'Mutation survived: tests did not detect unknown volume being falsely carved free.' >&2
            exit 1
          fi
          echo 'Mutation killed: unseen volume cannot be silently reclassified as free.'

      - name: Typecheck and build production WebUI
        working-directory: webui
        run: npm run build

      - name: Verify build-id cache busting is embedded
        working-directory: webui
        run: |
          set -euo pipefail
          grep -E 'assets/app\.js\?v=[0-9a-f]{20}' esp-dist/index.html
          grep -E 'assets/app\.css\?v=[0-9a-f]{20}' esp-dist/index.html
          cat esp-dist/build-id.txt

      - name: Verify operator UX and browser telemetry are in production bundle
        working-directory: webui
        shell: bash
        run: |
          set -euo pipefail
          gzip -cd esp-dist/assets/app.js.gz >/tmp/geolocator-app.js
          grep -F 'Finish & save scan' /tmp/geolocator-app.js
          grep -F 'Mark corners' /tmp/geolocator-app.js
          grep -F 'Quality map' /tmp/geolocator-app.js
          grep -F 'WEBUI_BOOT' /tmp/geolocator-app.js
          grep -F 'XR_PROGRESS' /tmp/geolocator-app.js
          grep -F 'XR_MANUAL_POINT_ADDED' /tmp/geolocator-app.js

  stress-mobile-chrome:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: webui/package-lock.json

      - name: Install locked WebUI dependencies
        working-directory: webui
        run: npm ci

      - name: Start Vite source server
        working-directory: webui
        shell: bash
        run: |
          set -euo pipefail
          npm run dev -- --host 127.0.0.1 --port 4173 >/tmp/geolocator-vite.log 2>&1 &
          echo $! >/tmp/geolocator-vite.pid
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:4173/stress/xr-mobile-stress.html >/dev/null; then
              exit 0
            fi
            sleep 0.5
          done
          cat /tmp/geolocator-vite.log
          exit 1

      - name: Run mid-range Android Chrome scan stress
        working-directory: webui
        env:
          XR_STRESS_CPU_THROTTLE: '4'
          XR_STRESS_TIMEOUT_MS: '180000'
        run: npm run stress:xr:mobile

      - name: Profile mid-range Android Chrome hotspots
        if: always()
        working-directory: webui
        env:
          XR_STRESS_CPU_THROTTLE: '4'
          XR_STRESS_TIMEOUT_MS: '180000'
          XR_STRESS_PROFILE: '1'
        run: npm run stress:xr:mobile

      - name: Print Vite server log on failure
        if: failure()
        run: cat /tmp/geolocator-vite.log || true

  validate-firmware:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    container:
      image: espressif/idf:v5.5.4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: webui/package-lock.json

      - name: Verify VM toolchain versions
        shell: bash
        run: |
          set -euo pipefail
          node --version
          npm --version
          . /opt/esp/idf/export.sh
          idf.py --version

      - name: Build ESP32-S3 firmware with current WebUI
        shell: bash
        run: |
          set -euo pipefail
          . /opt/esp/idf/export.sh
          idf.py build

      - name: Prove firmware embedded the current browser bundle
        shell: bash
        run: |
          set -euo pipefail
          test -s components/web_server/generated_webui_assets_app.js.gz
          gzip -cd components/web_server/generated_webui_assets_app.js.gz >/tmp/embedded-app.js
          grep -F 'Finish & save scan' /tmp/embedded-app.js
          grep -F 'Mark corners' /tmp/embedded-app.js
          grep -F 'WEBUI_BOOT' /tmp/embedded-app.js
          grep -F 'XR_PROGRESS' /tmp/embedded-app.js
          grep -F 'XR_MANUAL_POINT_ADDED' /tmp/embedded-app.js
          grep -E 'GeoLocator React Web UI seed will be embedded' build/log/idf_py_stdout_output 2>/dev/null || true
