name: XR Agent Slice B

on:
  push:
    branches:
      - agent/xr-perf-guide
    paths:
      - .github/workflows/xr-agent-slice-b.yml

permissions:
  contents: write

jobs:
  implement-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/xr-perf-guide
          fetch-depth: 0

      - name: Replace fixed pixel feature reprobe with metric policy
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('webui/src/xr/depthPointCloudV2.ts')
          text = path.read_text(encoding='utf-8')

          import_anchor = "} from './surfaceFeatureDensity';\nimport {"
          import_replacement = "} from './surfaceFeatureDensity';\nimport { metricFeatureProbeRadius } from './metricFeatureProbe';\nimport {"
          if text.count(import_anchor) != 1:
              raise SystemExit('surfaceFeatureDensity import anchor did not match exactly once')
          text = text.replace(import_anchor, import_replacement, 1)

          fixed_constant = 'const FEATURE_PROBE_PIXEL_RADIUS = 2.0;\n'
          if text.count(fixed_constant) != 1:
              raise SystemExit('fixed feature pixel radius constant did not match exactly once')
          text = text.replace(fixed_constant, '', 1)

          old = """          const angle = (phase * 0.17320508075688773 + featureProbeSequence * GOLDEN_ANGLE_RADIANS) % (Math.PI * 2);\n          featureProbeSequence += 1;\n          const du = Math.cos(angle) * FEATURE_PROBE_PIXEL_RADIUS / Math.max(1, depth.width);\n          const dv = Math.sin(angle) * FEATURE_PROBE_PIXEL_RADIUS / Math.max(1, depth.height);\n          featureSupersampleProbes += 2;\n          featureProbeCountsByCell.set(featureCoverageKey, cellFeatureProbes + 2);\n          integrateAt(u - du, v - dv, false);\n          integrateAt(u + du, v + dv, false);\n          return local;"""
          new = """          const probeRadius = metricFeatureProbeRadius({\n            depthMeters,\n            voxelSizeMeters: this.voxelSizeMeters,\n            projectionScaleX: p00,\n            projectionScaleY: p11,\n            depthWidth: depth.width,\n            depthHeight: depth.height,\n          });\n          if (probeRadius !== null) {\n            const angle = (phase * 0.17320508075688773 + featureProbeSequence * GOLDEN_ANGLE_RADIANS) % (Math.PI * 2);\n            featureProbeSequence += 1;\n            const du = Math.cos(angle) * probeRadius.normalizedRadiusU;\n            const dv = Math.sin(angle) * probeRadius.normalizedRadiusV;\n            featureSupersampleProbes += 2;\n            featureProbeCountsByCell.set(featureCoverageKey, cellFeatureProbes + 2);\n            integrateAt(u - du, v - dv, false);\n            integrateAt(u + du, v + dv, false);\n            return local;\n          }"""
          if text.count(old) != 1:
              raise SystemExit('feature reprobe block did not match exactly once')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: webui/package-lock.json

      - name: Install WebUI dependencies
        working-directory: webui
        run: npm ci

      - name: Typecheck WebUI
        working-directory: webui
        run: npm run typecheck

      - name: Run Slice B metric reprobe regressions
        working-directory: webui
        run: npx --yes vitest@4.1.11 run tests/xr/metricFeatureProbe.test.ts tests/xr/adaptiveDepthProbeBudget.test.ts tests/xr/depthPointCloud.test.ts

      - name: Record convex activation debt for Slice D
        continue-on-error: true
        working-directory: webui
        run: npx --yes vitest@4.1.11 run tests/xr/featureAwareAllocation.test.ts

      - name: Record full XR baseline without blocking Slice B
        continue-on-error: true
        working-directory: webui
        run: npm run test:xr

      - name: Commit verified Slice B
        shell: bash
        run: |
          if git diff --quiet -- webui/src/xr/depthPointCloudV2.ts; then
            echo 'Expected depthPointCloudV2 metric reprobe change is missing.' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add webui/src/xr/depthPointCloudV2.ts
          git commit -m 'make XR feature reprobes metric aware'
          git push origin HEAD:agent/xr-perf-guide
