name: XR Agent Slice C

on:
  push:
    branches:
      - agent/xr-perf-guide
    paths:
      - .github/workflows/xr-agent-slice-c.yml

permissions:
  contents: write

jobs:
  implement-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/xr-perf-guide
          fetch-depth: 0

      - name: Remove post-AI per-surfel allocation churn
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          runtime_path = Path('webui/src/xr/monocularPriorRuntime.ts')
          runtime = runtime_path.read_text(encoding='utf-8')

          old_import = "import { projectProjectPointToNormalized } from './projectionMath';"
          new_import = """import {
            multiplyMat4,
            projectProjectPointToNormalized,
            rigidInverse,
          } from './projectionMath';"""
          if runtime.count(old_import) != 1:
              raise SystemExit('projectionMath import did not match exactly once')
          runtime = runtime.replace(old_import, new_import, 1)

          old_calibrated = """  /** Sparse physical frontmost depth from exactly the same staged XR view. */
            physicalGuard: PhysicalDepthGuardFrame;
          }"""
          new_calibrated = """  /** Sparse physical frontmost depth from exactly the same staged XR view. */
            physicalGuard: PhysicalDepthGuardFrame;
            /** Cached once per calibrated frame; bulk surfel filtering must not rebuild matrices per point. */
            viewFromWorld: Float32Array | null;
            viewProjection: Float32Array | null;
          }"""
          if runtime.count(old_calibrated) != 1:
              raise SystemExit('CalibratedPrior block did not match exactly once')
          runtime = runtime.replace(old_calibrated, new_calibrated, 1)

          old_rgba = """  if (frame.rgba !== undefined && frame.rgba.length >= expected) {
            return frame.rgba.length === expected ? frame.rgba.slice() : frame.rgba.slice(0, expected);
          }"""
          new_rgba = """  if (frame.rgba !== undefined && frame.rgba.length >= expected) {
            // stagePostScan already owns a cloned RGBA buffer. Do not duplicate the
            // whole image again immediately before the one-shot model invocation.
            return frame.rgba.length === expected ? frame.rgba : frame.rgba.subarray(0, expected);
          }"""
          if runtime.count(old_rgba) != 1:
              raise SystemExit('guidanceAsRgba copy block did not match exactly once')
          runtime = runtime.replace(old_rgba, new_rgba, 1)

          old_stage = """    this.staged = {
              guidance: cloneGuidance(guidance),
              anchors: anchors.map((anchor) => ({ ...anchor })),
              physicalGuard: {
                width: physicalGuard.width,
                height: physicalGuard.height,
                depthMeters: physicalGuard.depthMeters.slice(),
              },
            };"""
          new_stage = """    this.staged = {
              guidance: cloneGuidance(guidance),
              // Both collectors above create fresh owned objects/typed arrays, so a
              // second clone here only increases live-XR allocation pressure.
              anchors,
              physicalGuard,
            };"""
          if runtime.count(old_stage) != 1:
              raise SystemExit('stagePostScan clone block did not match exactly once')
          runtime = runtime.replace(old_stage, new_stage, 1)

          old_assign = """      this.calibrated = {
                frame: prior,
                calibration,
                captureGuidance: staged.guidance,
                physicalGuard: staged.physicalGuard,
              };"""
          new_assign = """      const viewFromWorld = staged.guidance.worldFromView === undefined
                ? null
                : rigidInverse(staged.guidance.worldFromView);
              const viewProjection = viewFromWorld === null || staged.guidance.projectionMatrix === undefined
                ? null
                : multiplyMat4(staged.guidance.projectionMatrix, viewFromWorld);
              this.calibrated = {
                frame: prior,
                calibration,
                captureGuidance: staged.guidance,
                physicalGuard: staged.physicalGuard,
                viewFromWorld,
                viewProjection,
              };"""
          if runtime.count(old_assign) != 1:
              raise SystemExit('calibrated assignment did not match exactly once')
          runtime = runtime.replace(old_assign, new_assign, 1)

          method_anchor = """  postScanSurfaceAgreement(position: ProjectPoint): MonocularSurfaceAgreement {"""
          bulk_method = """  /**
           * Allocation-light bulk path used by the post-scan TSDF handoff.
           * Returns true for every unavailable/occluded/invalid case (fail-open)
           * and false only for a physically frontmost surfel that a calibrated
           * monocular prior confidently contradicts.
           */
          postScanAcceptsSurfaceXYZ(projectX: number, projectY: number, projectZ: number): boolean {
            const calibrated = this.calibrated;
            const viewFromWorld = calibrated?.viewFromWorld;
            const vp = calibrated?.viewProjection;
            if (!this.enabled || calibrated === null || viewFromWorld === null || vp === null) return true;
            if (![projectX, projectY, projectZ].every(Number.isFinite)) return true;

            // Project convention [X horizontal, Y horizontal, Z height]
            // -> WebXR [X, Y-up, Z-back].
            const x = projectX;
            const y = projectZ;
            const z = -projectY;
            const viewZ = viewFromWorld[2] * x + viewFromWorld[6] * y + viewFromWorld[10] * z + viewFromWorld[14];
            const physicalMeters = -viewZ;
            if (!validPhysicalDepth(physicalMeters)) return true;

            const clipX = vp[0] * x + vp[4] * y + vp[8] * z + vp[12];
            const clipY = vp[1] * x + vp[5] * y + vp[9] * z + vp[13];
            const clipZ = vp[2] * x + vp[6] * y + vp[10] * z + vp[14];
            const clipW = vp[3] * x + vp[7] * y + vp[11] * z + vp[15];
            if (![clipX, clipY, clipZ, clipW].every(Number.isFinite) || clipW <= 1e-6) return true;
            const ndcX = clipX / clipW;
            const ndcY = clipY / clipW;
            const ndcZ = clipZ / clipW;
            const u = (ndcX + 1) * 0.5;
            const v = (1 - ndcY) * 0.5;
            if (u < 0 || u > 1 || v < 0 || v > 1 || ndcZ < -1 || ndcZ > 1) return true;

            if (!physicalDepthGuardAllowsAiVeto(calibrated.physicalGuard, u, v, physicalMeters)) return true;
            const priorMeters = calibratedPriorDepthMeters(calibrated.frame, calibrated.calibration, u, v);
            if (priorMeters === null) return true;
            const vetoThreshold = Math.max(0.32, physicalMeters * 0.30);
            return Math.abs(priorMeters - physicalMeters) <= vetoThreshold;
          }

          postScanSurfaceAgreement(position: ProjectPoint): MonocularSurfaceAgreement {"""
          if runtime.count(method_anchor) != 1:
              raise SystemExit('postScanSurfaceAgreement anchor did not match exactly once')
          runtime = runtime.replace(method_anchor, bulk_method, 1)
          runtime_path.write_text(runtime, encoding='utf-8')

          sparse_path = Path('webui/src/xr/sparseTsdfClient.ts')
          sparse = sparse_path.read_text(encoding='utf-8')
          old_filter = """  const accepted: number[] = [];
            for (let index = 0; index < pointCount; index += 1) {
              const offset = index * 3;
              const agreement = optionalMonocularPrior.postScanSurfaceAgreement([
                input.positions[offset],
                input.positions[offset + 1],
                input.positions[offset + 2],
              ]);
              if (!agreement.available || agreement.accepted) accepted.push(index);
            }

            const rejected = pointCount - accepted.length;
            if (rejected === 0) return { input, rejected: 0, applied: true };
            const rejectFraction = rejected / pointCount;
            if (rejectFraction > MAX_AI_REJECT_FRACTION || accepted.length < MIN_POST_AI_SURFELS) {"""
          new_filter = """  const retained = new Uint8Array(pointCount);
            let acceptedCount = 0;
            for (let index = 0; index < pointCount; index += 1) {
              const offset = index * 3;
              const keep = optionalMonocularPrior.postScanAcceptsSurfaceXYZ(
                input.positions[offset],
                input.positions[offset + 1],
                input.positions[offset + 2],
              );
              if (!keep) continue;
              retained[index] = 1;
              acceptedCount += 1;
            }

            const rejected = pointCount - acceptedCount;
            if (rejected === 0) return { input, rejected: 0, applied: true };
            const rejectFraction = rejected / pointCount;
            if (rejectFraction > MAX_AI_REJECT_FRACTION || acceptedCount < MIN_POST_AI_SURFELS) {"""
          if sparse.count(old_filter) != 1:
              raise SystemExit('post-AI accepted-index block did not match exactly once')
          sparse = sparse.replace(old_filter, new_filter, 1)

          old_copy = """  const positions = new Float32Array(accepted.length * 3);
            const normals = new Float32Array(accepted.length * 3);
            const confidence = new Float32Array(accepted.length);
            accepted.forEach((source, target) => {
              const sourceOffset = source * 3;
              const targetOffset = target * 3;
              positions[targetOffset] = input.positions[sourceOffset];
              positions[targetOffset + 1] = input.positions[sourceOffset + 1];
              positions[targetOffset + 2] = input.positions[sourceOffset + 2];
              normals[targetOffset] = input.normals[sourceOffset];
              normals[targetOffset + 1] = input.normals[sourceOffset + 1];
              normals[targetOffset + 2] = input.normals[sourceOffset + 2];
              confidence[target] = input.confidence[source];
            });

            return {
              input: { ...input, positions, normals, confidence, maxInputPoints: Math.min(input.maxInputPoints ?? accepted.length, accepted.length) },"""
          new_copy = """  const positions = new Float32Array(acceptedCount * 3);
            const normals = new Float32Array(acceptedCount * 3);
            const confidence = new Float32Array(acceptedCount);
            let target = 0;
            for (let source = 0; source < pointCount; source += 1) {
              if (retained[source] === 0) continue;
              const sourceOffset = source * 3;
              const targetOffset = target * 3;
              positions[targetOffset] = input.positions[sourceOffset];
              positions[targetOffset + 1] = input.positions[sourceOffset + 1];
              positions[targetOffset + 2] = input.positions[sourceOffset + 2];
              normals[targetOffset] = input.normals[sourceOffset];
              normals[targetOffset + 1] = input.normals[sourceOffset + 1];
              normals[targetOffset + 2] = input.normals[sourceOffset + 2];
              confidence[target] = input.confidence[source];
              target += 1;
            }

            return {
              input: { ...input, positions, normals, confidence, maxInputPoints: Math.min(input.maxInputPoints ?? acceptedCount, acceptedCount) },"""
          if sparse.count(old_copy) != 1:
              raise SystemExit('post-AI output-copy block did not match exactly once')
          sparse_path.write_text(sparse.replace(old_copy, new_copy, 1), encoding='utf-8')
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: webui/package-lock.json

      - name: Install WebUI dependencies
        working-directory: webui
        run: npm ci

      - name: Typecheck WebUI
        working-directory: webui
        run: npm run typecheck

      - name: Run Slice C post-AI regressions
        working-directory: webui
        run: npx --yes vitest@4.1.11 run tests/xr/monocularPostScanBulkFilter.test.ts tests/xr/monocularPostScanRuntime.test.ts tests/xr/monocularPriorRuntime.test.ts tests/xr/monocularPostScanFailure.test.ts tests/xr/monocularDepthPrior.test.ts

      - name: Record sparse client Node-harness debt for Slice D
        continue-on-error: true
        working-directory: webui
        run: npx --yes vitest@4.1.11 run tests/xr/sparseTsdfClientLifecycle.test.ts

      - name: Record full XR baseline without blocking Slice C
        continue-on-error: true
        working-directory: webui
        run: npm run test:xr

      - name: Commit verified Slice C
        shell: bash
        run: |
          if git diff --quiet -- webui/src/xr/monocularPriorRuntime.ts webui/src/xr/sparseTsdfClient.ts; then
            echo 'Expected post-AI allocation changes are missing.' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add webui/src/xr/monocularPriorRuntime.ts webui/src/xr/sparseTsdfClient.ts
          git commit -m 'reduce post-scan AI surfel allocation churn'
          git push origin HEAD:agent/xr-perf-guide
