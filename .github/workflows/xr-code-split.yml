name: XR Code Split Verification

on:
  push:
    branches:
      - agent/xr-perf-guide
    paths:
      - .github/scripts/xr_code_split_patch.py
      - .github/workflows/xr-code-split.yml

permissions:
  contents: write

jobs:
  verify-and-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/xr-perf-guide
          fetch-depth: 0

      - name: Apply reviewed code-splitting patch
        run: python .github/scripts/xr_code_split_patch.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webui/package-lock.json

      - name: Install WebUI dependencies
        working-directory: webui
        run: npm ci

      - name: Typecheck
        working-directory: webui
        run: npm run typecheck

      - name: Run full XR suite
        working-directory: webui
        run: npm run test:xr

      - name: Build production WebUI and ESP assets
        working-directory: webui
        run: npm run build

      - name: Verify lazy boundary and chunk topology
        working-directory: webui
        run: npm run verify:bundle

      - name: Verify generated ESP split assets
        shell: bash
        run: |
          set -euo pipefail
          test -s webui/esp-dist/generated_webui_chunk_table.inc
          test -s webui/esp-dist/assets/app.js.gz
          test -s webui/esp-dist/assets/app.css.gz
          secondary_count=$(find webui/esp-dist/assets -maxdepth 1 -type f -name '*.js.gz' ! -name 'app.js.gz' | wc -l)
          test "$secondary_count" -ge 1
          echo "ESP secondary JS chunks: $secondary_count"
          find webui/dist/assets -maxdepth 1 -type f -printf '%f %s bytes\n' | sort
          find webui/esp-dist/assets -maxdepth 1 -type f -printf '%f %s bytes\n' | sort
          grep -F 'httpd_uri_match_wildcard' components/web_server/web_server.c
          grep -F '.uri = "/assets/*"' components/web_server/web_webui_flash.c
          grep -F 'WEB_WEBUI_CHUNK_ASSET_COUNT' components/web_server/web_webui_flash.c
          grep -F 'generated_webui_chunks' components/web_server/CMakeLists.txt

      - name: Check patch cleanliness
        run: git diff --check

      - name: Commit verified implementation and remove temporary CI
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add \
            webui/src/App.tsx \
            webui/vite.config.ts \
            webui/scripts/prepare-esp-assets.mjs \
            webui/scripts/verify-code-split-build.mjs \
            webui/package.json \
            components/web_server/CMakeLists.txt \
            components/web_server/web_server_internal.h \
            components/web_server/web_webui.c \
            components/web_server/web_webui_flash.c \
            components/web_server/web_server.c

          git rm -f \
            .github/scripts/xr_code_split_patch.py \
            .github/workflows/xr-code-split.yml

          unexpected=$(git status --porcelain --untracked-files=no | grep -vE '^(M |A |D ) (webui/|components/web_server/|\.github/scripts/xr_code_split_patch.py|\.github/workflows/xr-code-split.yml)' || true)
          if [ -n "$unexpected" ]; then
            echo 'Unexpected tracked changes:' >&2
            printf '%s\n' "$unexpected" >&2
            exit 1
          fi

          git diff --cached --stat
          git commit -m 'lazy-load post-scan 3D renderer'
          git push origin HEAD:agent/xr-perf-guide
